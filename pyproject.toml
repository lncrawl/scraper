[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lncrawl-scraper"
version = "0.1.1"
description = "HTTP scraper with Cloudflare bypass, browser fingerprint impersonation, stealth mode, proxy support, and a null-safe BeautifulSoup wrapper."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Sudipta Chandra", email = "dipu.sudipta@gmail.com" }]
keywords = ["scraper", "cloudflare", "beautifulsoup", "http", "stealth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests[socks]>=2.28",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.0",
    "quickjs>=1.19.4",
    "brotli>=1.2.0",
]

[project.optional-dependencies]
image = ["Pillow>=10.0"]
impersonate = ["curl_cffi>=0.7"]
all = ["lncrawl-scraper[image,impersonate]"]

[project.urls]
Homepage = "https://github.com/lncrawl/scraper"
Repository = "https://github.com/lncrawl/scraper"
Issues = "https://github.com/lncrawl/scraper/issues"
Changelog = "https://github.com/lncrawl/scraper/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.3.0",
    "responses>=0.25",
    "pyright>=1.1",
    "ruff>=0.15.16",
    "poethepoet>=0.37.0",
    "Pillow>=11.3.0",
    "lxml-stubs>=0.5.1",
    "curl-cffi>=0.7",
]

[tool.poe.tasks]
lint = [
    { cmd = "ruff check" },
    { cmd = "ruff format --check" },
    { cmd = "pyright" },
]
lint-fix = [
    { cmd = "ruff check --fix" },
    { cmd = "ruff format" },
]
test = "pytest"
cov = "pytest --cov --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml"
build = [
    { ref = "lint" },
    { ref = "test" },
    { cmd = "uv build" },
]
publish = [
    { ref = "build" },
    { cmd = "uv publish" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:urllib3 v2 only supports OpenSSL:Warning",
]

[tool.coverage.run]
branch = true
source = ["scraper"]
relative_files = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "standard"
include = ["src", "tests", "examples"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
