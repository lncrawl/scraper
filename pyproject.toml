[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lncrawl-scraper"
version = "1.6.0"
description = "A scraper that diagnoses which detection layer is blocking it and escalates only as far as that layer requires."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Sudipta Chandra", email = "dipu.sudipta@gmail.com" }]
keywords = [
    "scraper",
    "cloudflare",
    "bot-detection",
    "tls-fingerprint",
    "impersonate",
    "web-bot-auth",
    "beautifulsoup",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "curl_cffi>=0.13",
    "requests[socks]>=2.28",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.0",
]

[project.optional-dependencies]
cdp = ["websockets>=13"]
botauth = ["cryptography>=44.0"]
image = ["Pillow>=10.0"]
all = ["lncrawl-scraper[cdp,botauth,image]"]

[project.urls]
Homepage = "https://lncrawl.github.io/scraper/"
Documentation = "https://lncrawl.github.io/scraper/"
Repository = "https://github.com/lncrawl/scraper"
Issues = "https://github.com/lncrawl/scraper/issues"
Changelog = "https://github.com/lncrawl/scraper/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.3.0",
    "responses>=0.25",
    "pyright>=1.1",
    "ruff>=0.15.16",
    "poethepoet>=0.37.0",
    "Pillow>=11.3.0",
    "lxml-stubs>=0.5.1",
    "curl-cffi>=0.7",
    "cryptography>=47.0.0",
    "websockets>=13",
]
docs = [
    "mkdocs-material>=9.7.0",
]

[tool.poe.tasks]
lint = [
    { cmd = "ruff check" },
    { cmd = "ruff format --check" },
    { cmd = "pyright" },
]
lint-fix = [
    { cmd = "ruff check --fix" },
    { cmd = "ruff format" },
]
test = "pytest"
cov = "pytest --cov --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml"
build = [
    { ref = "lint" },
    { ref = "test" },
    { cmd = "uv build" },
]
publish = [
    { ref = "build" },
    { cmd = "uv publish" },
]

# The docs site published to https://lncrawl.github.io/scraper/. Both tasks must run
# from the project root — pymdownx.snippets pulls README.md, CHANGELOG.md and
# examples/*.py in relative to it.
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"

# Live verification against real Cloudflare deployments. Not part of `test` — it needs
# the network, and the tor-pool tasks need a local pool. See livetest/README.md.
live-targets = "python livetest/targets.py"
live-probe = "python livetest/probe.py"
live-tor = "python livetest/tor_probe.py 45"
live = "python livetest/scenarios.py"
live-report = "python livetest/report.py"
live-all = [
    { ref = "live-probe" },
    { ref = "live-tor" },
    { ref = "live" },
    { ref = "live-report" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:urllib3 v2 only supports OpenSSL:Warning",
]

[tool.coverage.run]
branch = true
source = ["scraper"]
relative_files = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "standard"
include = ["src", "tests", "examples"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
