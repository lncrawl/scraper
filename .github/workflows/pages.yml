name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "hooks/**"
      - "whitepaper/**"
      - "livetest/report.html"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Never cancel a deploy in flight: a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install
        run: uv sync --only-group docs

      - name: Build
        run: uv run mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
