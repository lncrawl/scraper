name: Publish

on:
  # Triggered explicitly by release.yml after the GitHub Release is created.
  # GITHUB_TOKEN-created releases do not fire the `release: published` event
  # in other workflows, so we dispatch directly instead of relying on it.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true
        type: string

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.9"

      - name: Build distributions
        run: uv build

      - name: Check metadata renders on PyPI
        run: uvx twine check dist/*

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
