name: Release

# Triggered when a version tag is pushed (e.g. by the Bump Version workflow).
# Builds the distributions, extracts the matching CHANGELOG section, and creates
# a GitHub Release with the artifacts and notes attached. Publishing the release
# in turn triggers publish.yml, which uploads to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --all-groups --all-extras

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(uv version | awk '{print $NF}')"
          echo "tag=$tag_version package=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $pkg_version"
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Check metadata renders on PyPI
        run: uvx twine check dist/*

      - name: Extract changelog notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md | sed '/^\[.*\]: http/d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for ${GITHUB_REF_NAME}."
            echo "::error::Add a '## [${GITHUB_REF_NAME#v}] - YYYY-MM-DD' section and push it to main."
            exit 1
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Detect pre-release
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          # PEP 440 pre-release (aN/bN/rcN) or dev release (.devN) → mark as pre-release.
          if echo "$version" | grep -qE '[0-9](a|b|rc)[0-9]+|\.dev[0-9]+'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
