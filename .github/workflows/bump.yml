name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release segment to bump
        required: true
        default: patch
        type: choice
        # "stable" promotes a pre-release to its final version;
        # "none" bumps only the pre-release segment (e.g. rc1 -> rc2).
        options: [patch, minor, major, stable, none]
      pre:
        description: Pre-release segment (optional)
        required: false
        default: none
        type: choice
        options: [none, alpha, beta, rc]

jobs:
  bump:
    name: Bump version and push tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7

      - name: Bump version
        env:
          BUMP: ${{ inputs.bump }}
          PRE: ${{ inputs.pre }}
        run: |
          args=()
          if [ "$BUMP" != "none" ]; then args+=(--bump "$BUMP"); fi
          if [ "$PRE" != "none" ]; then args+=(--bump "$PRE"); fi
          if [ ${#args[@]} -eq 0 ]; then
            echo "::error::Select at least one of 'bump' or 'pre' (both were 'none')."
            exit 1
          fi
          echo "Running: uv version ${args[*]}"
          uv version "${args[@]}"

      - name: Read new version
        id: version
        run: echo "value=$(uv version | awk '{print $NF}')" >> $GITHUB_OUTPUT

      - name: Commit and tag
        uses: EndBug/add-and-commit@v9
        with:
          add: "pyproject.toml uv.lock"
          tag: "v${{ steps.version.outputs.value }}"
          message: "Bump version to v${{ steps.version.outputs.value }}"
