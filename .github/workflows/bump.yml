name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release segment to bump
        required: true
        default: patch
        type: choice
        # "stable" promotes a pre-release to its final version;
        # "none" bumps only the pre-release segment (e.g. rc1 -> rc2).
        options: [patch, minor, major, stable, none]
      pre:
        description: Pre-release segment (optional)
        required: false
        default: none
        type: choice
        options: [none, alpha, beta, rc]

jobs:
  bump:
    name: Bump version and push tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7

      - name: Build version args
        id: args
        env:
          BUMP: ${{ inputs.bump }}
          PRE: ${{ inputs.pre }}
        run: |
          args=()
          if [ "$BUMP" != "none" ]; then args+=(--bump "$BUMP"); fi
          if [ "$PRE" != "none" ]; then args+=(--bump "$PRE"); fi
          if [ ${#args[@]} -eq 0 ]; then
            echo "::error::Select at least one of 'bump' or 'pre' (both were 'none')."
            exit 1
          fi
          # Persist as a space-separated string for subsequent steps
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"

      - name: Preview new version (dry-run)
        id: preview
        run: |
          new_version=$(uv version --dry-run --short ${{ steps.args.outputs.args }})
          echo "value=$new_version" >> "$GITHUB_OUTPUT"
          echo "New version will be: $new_version"

      - name: Verify CHANGELOG has an entry for the new version
        run: |
          version="${{ steps.preview.outputs.value }}"
          if ! grep -qE "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for v$version."
            echo "::error::Add a '## [$version] - YYYY-MM-DD' section and push it to main before releasing."
            exit 1
          fi
          echo "CHANGELOG entry for v$version found."

      - name: Bump version
        run: uv version ${{ steps.args.outputs.args }}

      - name: Read new version
        id: version
        run: echo "value=$(uv version | awk '{print $NF}')" >> $GITHUB_OUTPUT

      - name: Commit and tag
        uses: EndBug/add-and-commit@v10
        with:
          add: "pyproject.toml uv.lock"
          tag: "v${{ steps.version.outputs.value }}"
          message: "Bump version to v${{ steps.version.outputs.value }}"

      - name: Trigger release workflow
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --field tag="v${{ steps.version.outputs.value }}"
        env:
          GH_TOKEN: ${{ secrets.LNCRAWL_PAT }}
